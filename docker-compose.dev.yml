# Local infrastructure only. Run apps with pnpm on the host.
# Host ports avoid the common 5432 / 6379 collisions.

services:
  postgres:
    image: postgres:16-alpine
    container_name: aethera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aethera}
      POSTGRES_USER: ${POSTGRES_USER:-aethera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aethera_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./database/migrations/002_anomaly_kind.sql:/docker-entrypoint-initdb.d/002_anomaly_kind.sql
      - ./database/migrations/003_phase3_context.sql:/docker-entrypoint-initdb.d/003_phase3_context.sql
      - ./database/migrations/004_sample_retention.sql:/docker-entrypoint-initdb.d/004_sample_retention.sql
      - ./database/seeds/001_airports.sql:/docker-entrypoint-initdb.d/005_airports.sql
      - ./database/migrations/005_phase4_history.sql:/docker-entrypoint-initdb.d/006_phase4_history.sql
      - ./database/migrations/006_session_upsert.sql:/docker-entrypoint-initdb.d/007_session_upsert.sql
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aethera} -d ${POSTGRES_DB:-aethera}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aethera-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
